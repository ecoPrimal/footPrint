<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootPrint — Home Planner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <!-- Top Toolbar -->
  <header id="toolbar" role="toolbar" aria-label="Main toolbar">
    <div class="toolbar-left">
      <button id="btn-toggle-layers" class="sidebar-toggle" title="Toggle layers panel" aria-label="Toggle layers panel" aria-expanded="false" aria-controls="layer-panel">&#9776;</button>
      <span class="logo" aria-hidden="true">FootPrint</span>
    </div>
    <div class="toolbar-center">
      <label for="location-picker" class="sr-only">Known location</label>
      <select id="location-picker" title="Jump to known location" aria-label="Jump to known location">
        <option value="">Known Locations…</option>
      </select>
      <label for="geocoder-input" class="sr-only">Search address</label>
      <input type="text" id="geocoder-input" placeholder="Search address…" autocomplete="off" aria-label="Search address" />
      <button id="geocoder-btn" title="Search" aria-label="Search address">&#128269;</button>
    </div>
    <div class="toolbar-right">
      <button id="btn-new" title="New Project" aria-label="New project">New</button>
      <button id="btn-save" title="Save Project" aria-label="Save project">Save</button>
      <button id="btn-load" title="Load Project" aria-label="Load project">Load</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="btn-grid" title="Toggle engineering grid" aria-label="Toggle engineering grid" aria-pressed="false">Grid</button>
      <button id="btn-snap" title="Toggle snap" aria-label="Toggle snap to grid" aria-pressed="false">Snap</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="btn-measure" title="Measure distance/area" aria-label="Measure distance or area" aria-pressed="false">Measure</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div id="app">

    <!-- Left Sidebar: Layers + Data Sources -->
    <aside id="layer-panel" role="complementary" aria-label="Layers and data sources">
      <div class="panel-header">
        <h3 id="layer-panel-title">Layers</h3>
        <button id="btn-add-layer" title="Add custom layer" aria-label="Add custom layer">+</button>
      </div>
      <ul id="layer-list" role="listbox" aria-labelledby="layer-panel-title"></ul>

      <div class="panel-header data-header">
        <h3 id="data-sources-title">Data Sources</h3>
      </div>
      <ul id="data-source-list" role="list" aria-labelledby="data-sources-title"></ul>

      <div id="discovery-panel" class="hidden">
        <div class="panel-header">
          <h3>Discovery</h3>
          <button id="btn-dismiss-discover" title="Dismiss" aria-label="Dismiss discovery panel">&times;</button>
        </div>
        <ul id="discovery-list" role="list"></ul>
      </div>
    </aside>

    <!-- Map Container -->
    <main id="map" role="application" aria-label="Interactive map"></main>

    <!-- Right Sidebar: Properties -->
    <aside id="props-panel" class="collapsed" role="complementary" aria-label="Shape properties">
      <div class="panel-header">
        <h3>Properties</h3>
        <button id="btn-close-props" title="Close" aria-label="Close properties panel">&times;</button>
      </div>
      <div id="props-content">
        <p class="hint">Select a shape to view properties.</p>
      </div>
    </aside>

  </div>

  <!-- Load Modal (hidden) -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Load Project</h3>
        <button id="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Agent Panel -->
  <div id="agent-panel" class="agent-collapsed" role="complementary" aria-label="AI Agent">
    <div id="agent-panel-header">
      <span id="agent-status-dot" class="agent-dot-disconnected" aria-hidden="true"></span>
      <span class="agent-title">Agent</span>
      <span id="agent-badge" class="agent-badge hidden" aria-live="polite">0</span>
      <button id="btn-toggle-agent" title="Toggle agent panel" aria-label="Toggle agent panel" aria-expanded="false">&#9650;</button>
    </div>
    <div id="agent-panel-body">
      <ul id="agent-log" role="log" aria-live="polite" aria-label="Agent messages"></ul>
      <div id="agent-input-row">
        <label for="agent-input" class="sr-only">Message the AI</label>
        <input type="text" id="agent-input" placeholder="Message the AI..." autocomplete="off" aria-label="Message the AI" />
        <button id="agent-send" aria-label="Send message">Send</button>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <footer id="status-bar" role="status" aria-label="Map status" aria-live="polite">
    <span id="status-coords">Lat: --  Lng: --</span>
    <span class="status-sep">|</span>
    <span id="status-zoom">Zoom: --</span>
    <span class="status-sep">|</span>
    <span id="status-scale">1:--</span>
    <span class="status-sep">|</span>
    <span id="status-snap">Snap: ON</span>
    <span class="status-sep">|</span>
    <span id="status-grid">Grid: OFF</span>
    <span class="status-sep">|</span>
    <span id="status-elev">Elev: --</span>
  </footer>

  <!-- Measurement tooltip container -->
  <div id="measure-tooltip" class="hidden"></div>

  <script type="module" src="/src/client/app.ts"></script>
</body>
</html>
